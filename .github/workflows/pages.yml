name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test
        run: npm test

      # Only the files the browser needs; the service worker gets this commit
      # as its cache version so players pick up the new files.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html style.css manifest.webmanifest sw.js js icons _site/
          sed -i "s/^const BUILD = \"dev\";/const BUILD = \"${GITHUB_SHA::12}\";/" _site/sw.js
          grep -q "const BUILD = \"${GITHUB_SHA::12}\";" _site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
